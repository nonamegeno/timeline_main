<style>
  #eftTimeline, #eftTimeline * { box-sizing: border-box; }
  .eft-timeline{
    --paper:#F1E9D8; --ink:#2B2113; --rule:#B7A585;
    --rule-major:#8C7A5C; --accent:#A4472B; --accent-soft:#D9C7A8;
    max-width:100%;
    width:100%;
    margin:0 auto;
    padding:28px 0 20px;
    background:var(--paper); color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    border-radius:2px;
  }
  .eft-year{
    font-family:'Spectral',Georgia,serif; font-weight:600;
    font-size:clamp(2.2rem,6vw,3.2rem); text-align:center;
    letter-spacing:0.02em; line-height:1; margin-bottom:18px;
    transition:opacity .18s ease;
  }
  .eft-ruler{
    text-align:center; font-size:.85rem; font-style:italic; color:var(--rule-major);
    margin:2px 0 16px;
    min-height:0;
    transition:opacity .18s ease;
  }
  .eft-viewport{
    position:relative; overflow-x:auto; overflow-y:hidden;
    cursor:grab; padding:8px 0 26px;
    scrollbar-width:thin; scrollbar-color:var(--rule-major) transparent;
    outline:none;
  }
  .eft-viewport:focus-visible{ box-shadow:inset 0 0 0 2px var(--accent); }
  .eft-viewport.dragging{ cursor:grabbing; scroll-behavior:auto; }
  .eft-viewport::-webkit-scrollbar{ height:6px; }
  .eft-viewport::-webkit-scrollbar-thumb{ background:var(--rule-major); border-radius:4px; }
  .eft-canvas{ position:relative; height:64px; }
  .eft-baseline{
    position:absolute; left:0; right:0; top:34px; height:1px; background:var(--rule-major);
  }
  .eft-tick{ position:absolute; top:30px; width:1px; background:var(--rule); }
  .eft-tick.minor{ height:8px; }
  .eft-tick.major{ height:14px; background:var(--rule-major); }
  .eft-ticklabel{
    position:absolute; top:0; transform:translateX(-50%);
    font-size:.7rem; color:var(--rule-major); font-variant-numeric:tabular-nums;
  }
  .eft-event{
    position:absolute; top:0; height:100%; width:34px;
    transform:translateX(-50%);
    background:none; border:none; padding:0; cursor:pointer;
    font-family:inherit; color:var(--ink);
  }
  .eft-dot{
    position:absolute; left:50%; top:34px; width:11px; height:11px;
    border-radius:50%; transform:translate(-50%,-50%);
    background:var(--paper); border:2px solid var(--rule-major);
    transition:background .15s, border-color .15s, transform .15s;
  }
  .eft-event.active .eft-dot{
    background:var(--accent); border-color:var(--accent); transform:translate(-50%,-50%) scale(1.3);
  }
  .eft-tag{
    position:absolute; left:50%; top:46px; transform:translateX(-50%);
    font-size:.7rem; white-space:nowrap; color:var(--rule-major);
    opacity:0; pointer-events:none; transition:opacity .15s, color .15s;
  }
  .eft-event.active .eft-tag,
  .eft-event:hover .eft-tag,
  .eft-event:focus-visible .eft-tag{ opacity:1; }
  .eft-event.active .eft-tag{ color:var(--accent); font-weight:500; }
  .eft-caret{
    width:0; height:0; margin:0 auto;
    border-left:6px solid transparent; border-right:6px solid transparent;
    border-bottom:7px solid var(--accent); opacity:.85;
  }
  .eft-desc{
    max-width:60ch; margin:12px auto 0; text-align:center;
    font-size:1rem; line-height:1.55;
    min-height:0;
    transition:opacity .18s ease;
  }
  .eft-desc a{
    color:var(--accent); text-decoration:underline; text-underline-offset:2px;
  }
  .eft-desc a:hover{ color:var(--ink); }
  .eft-hint{
    text-align:center; font-size:.75rem; color:var(--rule-major); margin-top:10px;
  }
  @media (prefers-reduced-motion: reduce){
    .eft-viewport{ scroll-behavior:auto; }
  }
</style>

<script>
(function(){
  // ---- 1. ДАННЫЕ: замените на свои вехи ----
  // Используйте обратные кавычки ` вместо " или ' — тогда двойные и
  // одинарные кавычки (в том числе в <a href="..."> и в апострофах)
  // внутри текста можно писать свободно, ничего не сломается.
  // Внутри text можно использовать HTML, например ссылки:
  // <a href="https://elfimovo.ru/..." target="_blank" rel="noopener">текст ссылки</a>
var EVENTS = [
        { year: 1620, title: `Начало истории`, text: `Территория, на которой сегодня стоит Елфимово, ещё пустует: на месте будущего села шумят дремучие леса. Местная мордва из близлежащих селений Уда и Старое Маресьево занимается здесь бортничеством — добычей меда лесных пчёл`, ruler: `Царствует: Михаил Фёдорович Романов` },
    { year: 1644, title: `Появление вотчины`, text: `Маресева пустошь продана со всеми угодьями и бортными ухожаями боярину Якову Куденетовичу Черкасскому, который основывает здесь село Знаменское.`, ruler: `Царствует: Михаил Фёдорович Романов` },
    { year: 1646, title: `Первая перепись`, text: `В 1646 году Маресьевская вотчина князей Черкасских впервые <a href="https://disk.yandex.ru/d/wVgA0g4ob35wAA">попадает в переписные книги</a>: будных майданов в вотчине на тот момент ещё не было.`, ruler: `Царствует: Михаил Фёдорович Романов` },
    { year: 1654, title: `Начало русско-польской войны`, text: `Яков Куденетович Черкасский выступает к Смоленску, русские войска занимают значительные территории на востоке Речи Посполитой. Тысячи крестьян с семьями перемещаются с восточных земель в боярские имения в Русском государстве. В лесах близ села Знаменское устраиваются будные станы для производства поташа.`, ruler: `Царствует: Алексей Михайлович Романов` },
    { year: 1666, title: `Яков Куденетович Черкасский умирает`, text: `Маресьевская вотчина (в том числе и Елфимово) переходит по наследству к его сыну, Алексею Яковлевичу Черкасскому`, ruler: `Царствует: Алексей Михайлович Романов` },
    { year: 1677, title: `Первое упоминание Елфимова в переписных книгах`, text: `<a href="https://disk.yandex.ru/d/dHSbi9yWTD-phQ">Переписная книга 1677 года</a> зафиксировала имена работников будных станов в вотчине Черкасских. Само село названия ещё не имело: в документе оно указано как безымянный майдан в бортном вотчинном лесу. Это было совсем небольшое поселение:  67 душ мужского пола, все они были записаны "белорусцами". Шафором (управляющим) майдана показан Елфимко Иванов сын Яблочков: по его имени село и получит позднее своё название.`, ruler: `Царствует: Фёдор Алексеевич Романов` },
    { year: 1710, title: `Первое упоминание топонима "Елфимово"`, text: `В <a href="https://disk.yandex.ru/d/_8AO59-_9TNBsQ">переписной книге 1710 года</a> впервые появляется собственное именование села. Поташный промысел в вотчине Черкасских к этому моменту полностью остановился по причине уничтожения окрестных лесов. Все жители починка записаны как простые крестьяне. Елфимово заметно выросло: в нём показан 61 двор, в которых живут 283 мужчины и 278 женщин.`, ruler: `Царствует: Пётр I Алексеевич` },
    { year: 1719, title: `Проводится первая ревизия крестьян`, text: `Замена подворного обложения подушной податью потребовала персонального учета податных сословий, к которым относились крестьяне, мещане и купцы. Согласно данным <a href="https://disk.yandex.ru/d/2pJ_MDVq4s8UtQ">ревизии 1719 года</a>, в Елфимове числилось 327 душ мужского пола.`, ruler: `Царствует: Пётр I Алексеевич` },
    { year: 1742, title: `Умирает Алексей Михайлович Черкасский`, text: `Владельцем Елфимова становится его вторая жена, Мария Юрьевна Черкасская (урождённая Трубецкая)`, ruler: `Царствует: Государыня-императрица Елизавета Петровна` },
    { year: 1746, title: `Первая сохранившаяся исповедная роспись`, text: `Из документа следует, что починок Елфимов относился к приходу церкви села Маресьево. Ознакомиться с содержанием исповедной росписи можно по <a href="https://disk.yandex.ru/d/RFfQX_EsK0BU2w">ссылке</a>.`, ruler: `Царствует: Государыня-императрица Елизавета Петровна` },
    { year: 1747, title: `Умирает Мария Юрьевна Черкасская`, text: `Маресьевская вотчина вместе с Елфимовым переходит к её единственной дочери - Варваре Алексеевне Черкасской`, ruler: `Царствует: Государыня-императрица Елизавета Петровна` },
    { year: 1756, title: `Первая сохранившаяся метрическая книга`, text: `К 1754 году в Елфимове уже стоял собственный храм, освященный в часть Покрова Пресвятой Богородицы. Это название храм пронесёт вплоть до своего закрытия в 1938 году. Первую метрическую книгу можно посмотреть, перейдя по <a href="https://disk.yandex.ru/d/Dau_fkSAk1IAdQ">ссылке</a>.`, ruler: `Царствует: Государыня-императрица Елизавета Петровна` },
    { year: 1763, title: `Новый владелец`, text: `Владельцем Елфимова становится Петр Борисович Шереметьев, муж Варвары Алексеевны Черкасской.`, ruler: `Царствует: Государыня-императрица Екатерина II` },
    { year: 1765, title: `Перестройка церкви`, text: `Покровская церковь сгорает в одном из многочисленных пожаров. Церковь отстраивают заново.`, ruler: `Царствует: Государыня-императрица Екатерина II` },
    { year: 1779, title: `Основан Лукояновский уезд`, text: `Он появился в составе Нижегородского наместничества в 1779 году в ходе административной реформы Екатерины II. В 1796 году наместничество было преобразовано в Нижегородскую губернию.`, ruler: `Царствует: Государыня-императрица Екатерина II` },
    { year: 1795, title: `Вотчина меняет хозяина`, text: `Новым владельцем Елфимова становится граф Алексей Кириллович Разумовский, муж Варвары Петровны (урождённой Шереметьевой). Маресьевскую вотчину он получил, вероятно, в качестве приданого около 1774 года.`, ruler: `Царствует: Государыня-императрица Екатерина II` },
    { year: 1812, title: `Первая Отечественная война`, text: `На борьбу с "Великой армией" Наполеона в составе Земского ополчения уходит несколько десятков елфимовцев. 11 из них не вернутся домой, отдав свою жизнь за Отечество. Подробнее см. информацию на страницах семей  <a href="https://elfimovo.ru/families/mayorov">Майоровых</a>, <a href="https://elfimovo.ru/families/mortin">Мортиных</a>, <a href="https://elfimovo.ru/families/fomochkin">Фомочкиных</a>, <a href="https://elfimovo.ru/families/yurochkin">Юрочкиных</a>, а также в материалах <a href="https://disk.yandex.ru/d/4H9W25XBwQzvWQ">ревизии 1816 года</a>.`, ruler: `Царствует: Государь-император Александр I` },
    { year: 1830, title: `Эпидемия`, text: `Елфимово охватывает <a href="https://disk.yandex.ru/d/dlyF_yUgRqWtTQ">вспышка неизвестной болезни</a>, поразившая более 130 человек. Село спасает сотский Карп Степанович <a href="https://elfimovo.ru/families/vorobyov">Воробьёв</a>, вовремя сообщив о беде в вотчинное правление.`, ruler: `Царствует: Государь-император Николай I` },
    { year: 1835, title: `Открытие`, text: `Этнограф и автор Толкового словаря живого великорусского языка, Владимир Иванович Даль, открывает белорусское происхождение елфимовцев. Исторю этого открытия сохранил для нас <a href="http://az.lib.ru/m/melxnikowpecherskij_p/text_1873_vospominaniya_o_dale.shtml">Павел Иванович Мельников-Печёрский</a>.`, ruler: `Царствует: Государь-император Николай I` },
    { year: 1837, title: `Новый владелец`, text: `Дочь Алексея Кирилловича Разумовского, Варвара Алексеевна Репнина, вместе с мужем <a href="https://ya.ru/archive/catalog/0dd1cf27-ad42-4fe4-b25a-174455fc65e7/46?center=960+1418">продают имение</a> князю Льву Петровичу Витгенштейну`, ruler: `Царствует: Государь-император Николай I` },
    { year: 1838, title: `Первые выселки`, text: `51 семья из Елфимова <a href="https://disk.yandex.ru/d/KVMpXSc_chxxNA">переселяется</a> на пустующее место близ Графской горы между оврагами Прыган и Малый Вешов. Появляется деревня Красная Поляна.`, ruler: `Царствует: Государь-император Николай I` },
    { year: 1841, title: `Новый владелец`, text: `Маресьевское имение вместе с Елфимовым <a href="https://ya.ru/archive/catalog/1ce6c4d6-0158-40f6-b09e-d8e418f311ad/36?center=679+1033">продано</a> тайному советнику Фёдору Петровичу Лубяновскому`, ruler: `Царствует: Государь-император Николай I` },
    { year: 1861, title: `Отмена крепостного права`, text: `Елфимовские крестьяне получают личную свободу. Однако земля оставалась собственностью помещика. Чтобы стать полноправными собственниками, крестьяне должны был выкупить надел: в 1862 году была составлена <a href="https://disk.yandex.ru/d/rhOK65kPSMrGdg">уставная грамота</a>, закреплявшая отношения крестьян и помещика на период выкупа земли.`, ruler: `Царствует: Государь-император Александр II` },
    { year: 1863, title: `Старообрядцы`, text: `В Елфимове появляется старообрядческая община Белокриницкой (Австрийской) иерархии. «Учение своё держат в секрете», - отмечает в своих записях елфимовский священник Григорий Иванович Прогрессов. `, ruler: `Царствует: Государь-император Александр II` },
    { year: 1869, title: `Борьба со старообрядчеством`, text: `Переведённый в село Елфимово из села Темяшева, священник Иоанн Добролюбов обеспокоен разгулом старообрядчества в селе и начинает активную борьбу с ним.`, ruler: `Царствует: Государь-император Александр II` },
    { year: 1878, title: `Пожар`, text: `5 июля 1878 года в Елфимове происходит пожар, уничтоживший более половины села (119 домов). Крестьяне обращаются за помощью к <a href="https://disk.yandex.ru/d/UAx4kRmEA6bWMQ">уездному начальству</a>`, ruler: `Царствует: Государь-император Александр II` },
    { year: 1887, title: `Школа грамоты`, text: `Отставной военный писарь Дмитрий Солнцев <a href="https://ya.ru/archive/catalog/3fff26d2-351b-4018-aefd-756c24f36f7c/71?center=356+450"> открывает в Елфимове домашнюю школу грамоты</a> для крестьянских детей, в которой обучаются 15 мальчиков`, ruler: `Царствует: Государь-император Александр III` },
    { year: 1891, title: `Великий голод`, text: `Сильнейший неурожай провоцирует массовый голод в Среднем Поволжье. С целью помощи голодающим в Елфимово приезжает Владимир Галактионович Короленко. Картина голодающего села описана им в повести "В голодный год".`, ruler: `Царствует: Государь-император Александр III` },
    { year: 1893, title: `Строительство школы `, text: `В Елфимове начинается <a href="https://ya.ru/archive/catalog/832e89d9-34f3-4b15-8ea8-32aa2ce30acc/5?center=334+560">строительство отдельного здания церковно-приходской школы</a> по типовому проекту.`, ruler: `Царствует: Государь-император Александр III` },
    { year: 1895, title: `Первая попытка переселения`, text: `11 семей просят <a href="https://disk.yandex.ru/d/Ro-Mln428UGM2Q">разрешения на переезд</a> в Енисейскую губернию`, ruler: `Царствует: Государь-император Николай II` },
    { year: 1902, title: `Перестройка Покровской церкви`, text: `Обветшавший за полтора века храм тщанием прихожан перестраивается на новом месте — ближе к современной центральной площади. Прежняя церковь за ветхостью <a href="https://disk.yandex.ru/i/t7eBIexarOXqHQ">упраздняется</a>.`, ruler: `Царствует: Государь-император Николай II` },
    { year: 1910, title: `Вслед за церковью переносят и кладбище`, text: `По прошению крестьян под него выделяют <a href="https://disk.yandex.ru/d/TpW3euuhhButQA">участок на Крынице</a>: здесь оно находится по сей день.`, ruler: `Царствует: Государь-император Николай II` },
    { year: 1911, title: `Эпоха великих реформ`, text:`В рамках Столыпинской аграрной реформы некоторые крестьяне начинают <a href="https://disk.yandex.ru/d/Op42V3WP3eI1sQ">переселение на хутора</a>. Елфимовцы в основном выбирают Вешовское имение Крестьянского поземельного банка.`, ruler: `Царствует: Государь-император Николай II` },
    { year: 1914, title: `Начало Первой мировой войны`, text: `В 1914-1918 годах на фронтах Великой войны погибнет более 100 уроженцев села.`, ruler: `Царствует: Государь-император Николай II` },
    { year: 1917, title: `Революция`, text: `Происходит коренной перелом в жизни государства. Отречение царя от престола, Октябрьская революция и ликвидация Временного правительства раскалывают общество: начинается гражданская война.`, ruler: `Период безвластия в России` },
    { year: 1920, title: `Образован посёлок Карповка `, text: `Несколько десятков семей из Елфимова уходят из села и образуют <a href="https://elfimovo.ru/karpovka">новый посёлок</a>.`, ruler: `Страной руководит: В.И.Ленин` },
    { year: 1921, title: `Образована Елфимовская волость`, text: `Больше-Полянская волость, существовавшая до революции, упраздняется и укрупняется. Елфимово становится новым волостным центром.`, ruler: `Страной руководит: В.И.Ленин` },
    { year: 1922, title: `Образован посёлок Белецкий`, text: `Он появляется на месте бывшей усадьбы землевладельцев Зыковых.`, ruler: `Страной руководит: В.И.Ленин` },
    { year: 1924, title: `Елфимовская волость упразднена`, text: `Постановлением Губернского исполнительного комитета от 04.04.1924 г. Елфимовская волость ликвидируется, селения передаются в состав Больше-Маресьевской волости`, ruler: `Страной руководит: В.И.Ленин` },
    { year: 1929, title: `Больше-Маресьевская волость упразднена `, text: `Постановлением Губернского исполнительного комитета от 20.06.1929 г. Больше-Полянская волость ликвидируется, селения передаются в состав Лукояновского района`, ruler: `Страной руководит: И.В.Сталин` },
    { year: 1930, title: `Коллективизация`, text: `В Елфимове образуется три колхоза: "Заветы Ильича", "Решительный бой" и "Красный Герой". Меняется уклад жизни крестьян: появляются раскулаченные, часть построек и хозяйств переходит в общее пользование.`, ruler: `Страной руководит: И.В.Сталин` },
    { year: 1938, title: `Закрытие Покровской церкви`, text: `Решением общих собраний колхозов Путь Ильича, Решительный бой и Красный герой, Покровская церковь <a href="https://disk.yandex.ru/d/4tt-IB2OVWYQsQ">закрывается</a>.`, ruler: `Страной руководит: И.В.Сталин` },
    { year: 1941, title: `Начинается Великая Отечественная война`, text: `7 июля 1941 года из села на фронт ушли сразу 28 человек, а потом и большая часть мужского населения Елфимова. Свыше 150 мужчин-елфимовцев отдадут свои жизни за Родину.`, ruler: `Страной руководит: И.В.Сталин` },
    { year: 1943, title: `Подвиг`, text: `В ночь с 23 на 24 сентября 1943 года уроженец Елфимова, гвардии лейтенант <a href="https://ru.ruwiki.ru/wiki/%D0%9A%D0%B8%D0%BD%D0%B5%D1%88%D0%BE%D0%B2,_%D0%98%D0%B2%D0%B0%D0%BD_%D0%9D%D0%B0%D1%83%D0%BC%D0%BE%D0%B2%D0%B8%D1%87?utm_referrer=https%3A%2F%2Fyandex.ru%2F">Иван Наумович Кинешов</a> делает шаг в бессмертие при форсировании Днепра. Захватив плацдарм, Иван Наумович под ураганным огнём врага удерживает его до подхода основных сил и погибает, уничтожив более 40 гитлеровцев. За этот подвиг он посмертно получает звание Героя Советского Союза. Имя Ивана Наумовича носила пионерская организация Елфимовской основной школы.`, ruler: `Страной руководит: И.В.Сталин` },
    { year: 1950, title: `Укрупнение колхозов`, text: `Карповский колхоз "Новый Путь" и белецковский "Красная Нива" объединяются. Новый колхоз получает название "Имени Калинина"`, ruler: `Страной руководит: И.В.Сталин` },
    { year: 1952, title: `На месте разрушенной Покровской церкви открывается новое здание школы.`, text: ` `, ruler: `Страной руководит: И.В.Сталин` },
    { year: 1980, title: `Активное строительство`, text: `Выросла улица «Молодёжная», в колхозе построены два крытых тока, два коровника, введено в строй сушильно-сортировальное хозяйство. В селе произведена телефонизация, пущен в эксплуатацию водопровод, началась газификация Елфимова."`, ruler: `Страной руководит: Л.И.Брежнев` },
    { year: 1994, title: `Исчезновение Карповки`, text: `Карповка окончательно пустеет и перестаёт существовать как населённый пункт.`, ruler: `Страной руководит: Президент Б.Н. Ельцин` },
    { year: 2001, title: `Открытие нового здания Елфимовской средней школы`, text: `Вместо обветшавшего деревянного здания 16 декабря 2000 года открывается новое кирпичное здание.`, ruler: `Страной руководит: В.В.Путин` }
  ];


var PX_PER_YEAR = 9;

  function escapeHtml(s){
    return String(s).replace(/[&<>]/g, function(c){
      return c === '&' ? '&amp;' : (c === '<' ? '&lt;' : '&gt;');
    });
  }

  var root = document.getElementById('eftTimeline');
  var viewport = document.getElementById('eftViewport');
  var canvas = document.getElementById('eftCanvas');
  var yearEl = document.getElementById('eftYear');
  var rulerEl = document.getElementById('eftRuler');
  var descEl = document.getElementById('eftDesc');

  var minYear = EVENTS[0].year, maxYear = EVENTS[EVENTS.length - 1].year;
  var pad = 0, totalW = 0, positions = [];

  function layout(){
    pad = Math.max(viewport.clientWidth / 2, 40);
    totalW = pad * 2 + (maxYear - minYear) * PX_PER_YEAR;
    canvas.style.width = totalW + 'px';
    canvas.innerHTML = '<div class="eft-baseline"></div>';

    // тики: минорные каждые 5 лет, подписи и высокий тик каждые 25 лет
    for (var y = Math.ceil(minYear / 5) * 5; y <= maxYear; y += 5) {
      var x = pad + (y - minYear) * PX_PER_YEAR;
      var major = (y % 25 === 0);
      var t = document.createElement('div');
      t.className = 'eft-tick ' + (major ? 'major' : 'minor');
      t.style.left = x + 'px';
      canvas.appendChild(t);
      if (major) {
        var lbl = document.createElement('div');
        lbl.className = 'eft-ticklabel';
        lbl.style.left = x + 'px';
        lbl.textContent = y;
        canvas.appendChild(lbl);
      }
    }

    // события: сперва честные позиции по годам, затем разводим слишком
    // близкие точки в стороны, чтобы они не слипались визуально
    var rawX = EVENTS.map(function(ev){ return pad + (ev.year - minYear) * PX_PER_YEAR; });
    var MIN_GAP = 16; // минимальное расстояние между соседними точками, px
    for (var i = 1; i < rawX.length; i++) {
      if (rawX[i] - rawX[i - 1] < MIN_GAP) rawX[i] = rawX[i - 1] + MIN_GAP;
    }
    var lastX = rawX[rawX.length - 1];
    if (lastX + pad > totalW) {
      totalW = lastX + pad;
      canvas.style.width = totalW + 'px';
    }

    positions = EVENTS.map(function(ev, i){
      var x = rawX[i];
      var btn = document.createElement('button');
      btn.className = 'eft-event';
      btn.style.left = x + 'px';
      btn.setAttribute('aria-label', ev.year + ': ' + ev.title);
      btn.innerHTML = '<span class="eft-dot"></span><span class="eft-tag">' + ev.year + '</span>';
      btn.addEventListener('click', function(){ goTo(i, true); });
      canvas.appendChild(btn);
      return x;
    });

    viewport.setAttribute('aria-valuemax', EVENTS.length - 1);
  }

  // Фиксируем высоту под самую длинную веху, чтобы блок не «прыгал»
  // при прокрутке таймлайна (у событий тексты разной длины).
  function reserveHeights(){
    // сбрасываем прежние значения, чтобы измерять «чистую» высоту
    descEl.style.minHeight = '0';
    rulerEl.style.minHeight = '0';

    // — измеряем .eft-desc через отдельную «линейку» вне потока —
    var probe = document.createElement('div');
    probe.className = 'eft-desc';
    probe.style.cssText =
      'position:absolute;visibility:hidden;pointer-events:none;' +
      'left:-99999px;top:0;box-sizing:border-box;min-height:0;';
    probe.style.width = descEl.clientWidth + 'px';
    document.body.appendChild(probe);

    var maxDesc = 0;
    EVENTS.forEach(function(ev){
      probe.innerHTML = escapeHtml(ev.title) + '. ' + ev.text;
      if (probe.offsetHeight > maxDesc) maxDesc = probe.offsetHeight;
    });
    document.body.removeChild(probe);

    descEl.style.minHeight = maxDesc + 'px';

    // — измеряем .eft-ruler прямо на элементе (синхронно, мигания нет) —
    var maxRuler = 0;
    var savedRuler = rulerEl.textContent;
    EVENTS.forEach(function(ev){
      rulerEl.textContent = ev.ruler || '';
      if (rulerEl.offsetHeight > maxRuler) maxRuler = rulerEl.offsetHeight;
    });
    rulerEl.textContent = savedRuler;
    rulerEl.style.minHeight = maxRuler + 'px';
  }

  var current = -1;
  function render(i){
    if (i === current) return;
    current = i;
    var ev = EVENTS[i];
    yearEl.style.opacity = 0; descEl.style.opacity = 0; rulerEl.style.opacity = 0;
    requestAnimationFrame(function(){
      yearEl.textContent = ev.year;
      descEl.innerHTML = escapeHtml(ev.title) + '. ' + ev.text;
      rulerEl.textContent = ev.ruler || '';
      descEl.querySelectorAll('a').forEach(function(a){
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });
      yearEl.style.opacity = 1; descEl.style.opacity = 1; rulerEl.style.opacity = 1;
    });
    var btns = canvas.querySelectorAll('.eft-event');
    btns.forEach(function(b, idx){ b.classList.toggle('active', idx === i); });
    viewport.setAttribute('aria-valuenow', i);
  }

  function nearestIndex(){
    var center = viewport.scrollLeft + viewport.clientWidth / 2;
    var best = 0, bestD = Infinity;
    positions.forEach(function(x, i){
      var d = Math.abs(x - center);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }

  function goTo(i, smooth){
    i = Math.max(0, Math.min(EVENTS.length - 1, i));
    var target = positions[i] - viewport.clientWidth / 2;
    viewport.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
    render(i);
  }

  var settleTimer;
  viewport.addEventListener('scroll', function(){
    render(nearestIndex());
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){ goTo(nearestIndex(), true); }, 130);
  }, { passive: true });

  // перетаскивание мышью
  var isDown = false, startX = 0, startScroll = 0;
  viewport.addEventListener('mousedown', function(e){
    isDown = true; viewport.classList.add('dragging');
    startX = e.pageX; startScroll = viewport.scrollLeft;
  });
  window.addEventListener('mouseup', function(){
    if (!isDown) return;
    isDown = false; viewport.classList.remove('dragging');
    goTo(nearestIndex(), true);
  });
  window.addEventListener('mousemove', function(e){
    if (!isDown) return;
    viewport.scrollLeft = startScroll - (e.pageX - startX);
  });

  // колесо мыши -> горизонтальная прокрутка
  viewport.addEventListener('wheel', function(e){
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      viewport.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });

  // клавиатура
  viewport.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') { goTo(current + 1, true); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { goTo(current - 1, true); e.preventDefault(); }
  });

  window.addEventListener('resize', function(){
    var i = current;
    layout();
    reserveHeights();
    goTo(i, false);
  });

  layout();
  reserveHeights();
  goTo(0, false);
})();
</script>
